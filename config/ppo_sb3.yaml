# PPO training configuration (Stable Baselines 3)

# --- Reward ---
reward_fn: StagedPickPlaceReward

# --- Algorithm ---
algo_kwargs:
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.0
  gae_lambda: 0.95

# --- Environment ---
env_name: PickPlaceCounterToCabinet
layout_ids: -2
style_ids: -2
horizon: 500
control_freq: 20

# --- Observation ---
use_camera_obs: false
include_cab_obs: true
image_size: 64

# --- Curriculum ---
# Set curriculum_init_dist > 0 to enable spawn-distance curriculum.
# max_spawn_dist grows by curriculum_epsilon for every training episode
# where the object is successfully grasped, up to curriculum_max_dist.
curriculum_init_dist: 0.05   # metres; 0 = disabled
curriculum_epsilon: 0.002    # metres added per grasped episode
curriculum_max_dist: 0.50    # cap (metres)

# --- Architecture ---
state_embed_dim: 256
image_embed_dim: 128
net_arch: [256, 256]

# --- Common hyperparameters ---
seed: 42
total_timesteps: 1000000
learning_rate: 0.0003
gamma: 0.99
n_envs: 4             # each RoboCasa/MuJoCo instance is ~1-2 GB; 16 OOMs on 31 GB RAM

# --- Logging / saving ---
save_dir: runs
log_dir: /tmp/rl_logs
checkpoint_freq: 50000
n_eval_episodes: 5
