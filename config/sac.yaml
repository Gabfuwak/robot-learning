# SAC training configuration
trainer: sb3

# --- Algorithm ---
algo: SAC
algo_kwargs:
  buffer_size: 300000
  batch_size: 256
  tau: 0.005
  ent_coef: auto
  learning_starts: 10000
  train_freq: 1
  gradient_steps: 1

# --- Environment ---
env_name: PickPlaceCounterToCabinet
layout_ids: -2       # all training layouts
style_ids: -2        # all training styles
horizon: 500
control_freq: 20

# --- Observation ---
use_camera_obs: false
image_size: 64

# --- Architecture ---
state_embed_dim: 256
image_embed_dim: 128
net_arch: [256, 256]

# --- Common hyperparameters ---
seed: 42
total_timesteps: 1000000
learning_rate: 0.0003
gamma: 0.99
n_envs: 1

# --- Logging / saving ---
save_dir: runs
log_dir: /tmp/rl_logs
checkpoint_freq: 50000
n_eval_episodes: 5
